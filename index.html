<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mis Proyectos</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header id="siteHeader">
  <h1 id="siteTitle">Cargando…</h1>
  <p id="siteTagline"></p>
</header>

<main>
  <p id="loadError" class="load-error" hidden>No se pudieron cargar los proyectos. Intenta recargar la página.</p>
  <div class="grid" id="grid"></div>
</main>

<div class="overlay" id="overlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <button class="modal-close" id="modalCloseBtn" aria-label="Cerrar">✕</button>
    <div class="modal-media" id="modalMedia"></div>
    <div class="modal-body">
      <button class="back-btn" id="modalBackBtn">← Volver a mis proyectos</button>
      <p class="modal-subtitle" id="modalSubtitle"></p>
      <h2 id="modalTitle" tabindex="-1"></h2>
      <p class="modal-meta" id="modalMeta"></p>
      <p id="modalDesc"></p>
      <ul class="modal-tags" id="modalTags"></ul>
      <div class="modal-links" id="modalLinks"></div>
      <div class="modal-contact" id="modalContact"></div>
    </div>
  </div>
</div>

<script src="js/app.js" defer></script>
</body>
</html>
